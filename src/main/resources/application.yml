#local 환경
spring:
  profiles:
    default: local
  datasource:
    url: jdbc:h2:tcp://localhost/~/mars
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none # 테이블 drop 후 자동 생성
    properties:
      hibernate:
        #         show_sql: true # 시스템 아웃으로 sql 출력
        format_sql: true



logging:
  level:
    org.hibernate.SQL: debug # 로거를 통해 sql 출력
    org.hibernate.type: trace # 파라미터 로거남기기
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.cache: trace # 캐시 로그 남기기

kis:
  api:
    grant_type: client_credentials
    app_key: app_key
    app_secret: app_secret
    access_token : access_token

firebase:
  credentials:
    path: firebase/mars-1a3f5-firebase-adminsdk-fbsvc-db14567537.json

notification:
  stock:
    title: "📈 주식 변동 알림"
    message: "변동률은 %.2f%% 이상 변동하였습니다."

